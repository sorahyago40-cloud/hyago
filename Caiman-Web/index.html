<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CAIMAN Panel - Mobile Web App">
    <meta name="theme-color" content="#1FFF00">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="CAIMAN">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%230A0F0A' width='180' height='180'/><text x='50%' y='50%' font-size='80' fill='%231FFF00' text-anchor='middle' dominant-baseline='middle' font-family='Arial'>🐊</text></svg>">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%230A0F0A' width='100' height='100'/><text x='50' y='60' font-size='60' text-anchor='middle'>🐊</text></svg>">
    <link rel="manifest" href="manifest.json">
    <title>CAIMAN Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body, #root {
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        :root {
            --primary-green: #1FFF00;
            --bright-green: #00FF00;
            --dark-bg: #0A0F0A;
            --secondary-bg: #1A1A1A;
            --panel-bg: #0D1B0D;
            --text-primary: #FFFFFF;
            --text-secondary: #E0E0E0;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--text-primary);
            overflow: hidden;
        }

        @media (prefers-color-scheme: dark) {
            body {
                background-color: var(--dark-bg);
                color: var(--text-primary);
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').catch(() => {});
        }
    </script>
</body>
</html>
